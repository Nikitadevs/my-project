<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nikita's portfolio: thoughtful software, selected projects, and the tools behind the work." />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Nikita | Computer Engineer</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('darkMode');
        const dark = savedTheme === 'true' || (savedTheme !== 'false' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0b1020' : '#f7f8fc');
      } catch {
        // The application will fall back to the system preference.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
